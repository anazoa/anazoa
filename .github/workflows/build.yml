name: Build

on:
    workflow_dispatch:

env:
    CARGO_TERM_COLOR: always
    CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: x86_64
                      runner: ubuntu-latest
                      lk_arch: x64
                      dynamic_target: x86_64-unknown-linux-gnu
                      static_target: x86_64-unknown-linux-musl
                      test_flags: --release
                    - arch: aarch64
                      runner: ubuntu-latest
                      lk_arch: arm64
                      dynamic_target: aarch64-unknown-linux-gnu
                      static_target: aarch64-unknown-linux-musl
                      test_flags: --release --no-run --target aarch64-unknown-linux-gnu
                      pkg_config_sysroot: /
                      pkg_config_path: /usr/lib/aarch64-linux-gnu/pkgconfig

        runs-on: ${{ matrix.runner }}

        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: recursive

            - name: Compute livekit submodule SHA
              id: lk-sha
              run: echo "sha=$(git -C livekit rev-parse HEAD)" >> "$GITHUB_OUTPUT"

            - name: Restore libwebrtc cache
              id: webrtc-cache
              uses: actions/cache/restore@v6
              with:
                  path: livekit/webrtc-sys/libwebrtc/linux-${{ matrix.lk_arch }}-release
                  key: libwebrtc-${{ matrix.lk_arch }}-${{ steps.lk-sha.outputs.sha }}-${{ hashFiles('patches/*.patch') }}

            - name: Patch livekit/webrtc-sys
              run: |
                  cp patches/hooks-opus.patch patches/hooks-vp9.patch livekit/webrtc-sys/libwebrtc/patches/
                  git -C livekit apply ../patches/livekit.patch

            - name: Free disk space
              if: steps.webrtc-cache.outputs.cache-hit != 'true'
              run: |
                  sudo rm -rf \
                    /usr/local/lib/android \
                    /usr/local/share/powershell \
                    /usr/share/dotnet \
                    /usr/share/swift \
                    /opt/ghc \
                    /opt/hostedtoolcache/CodeQL \
                    "$AGENT_TOOLSDIRECTORY/go" \
                    "$AGENT_TOOLSDIRECTORY/node"
                  sudo docker image prune -af || true
                  df -h

            - name: Install WebRTC build dependencies
              if: steps.webrtc-cache.outputs.cache-hit != 'true'
              run: |
                  sudo apt update
                  sudo apt install -y \
                    python3 python3-pip \
                    build-essential \
                    git curl lsb-release \
                    ninja-build \
                    pkg-config

            - name: Build libwebrtc
              if: steps.webrtc-cache.outputs.cache-hit != 'true'
              working-directory: livekit/webrtc-sys/libwebrtc
              run: bash build_linux.sh --arch ${{ matrix.lk_arch }} --profile release

            - name: Package libwebrtc build output
              run: |
                  tar -C livekit/webrtc-sys/libwebrtc -czf libwebrtc-linux-${{ matrix.arch }}-dev.tar.gz linux-${{ matrix.lk_arch }}-release

            - name: Upload libwebrtc artifact
              uses: actions/upload-artifact@v7
              with:
                  name: libwebrtc-linux-${{ matrix.arch }}-dev
                  path: libwebrtc-linux-${{ matrix.arch }}-dev.tar.gz

            - name: Save libwebrtc cache
              if: steps.webrtc-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@v6
              with:
                  path: livekit/webrtc-sys/libwebrtc/linux-${{ matrix.lk_arch }}-release
                  key: libwebrtc-${{ matrix.lk_arch }}-${{ steps.lk-sha.outputs.sha }}-${{ hashFiles('patches/*.patch') }}

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.dynamic_target }},${{ matrix.static_target }}

            - name: Cache Cargo registry
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.cargo/registry/index
                      ~/.cargo/registry/cache
                      ~/.cargo/git/db
                  key: cargo-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
                  restore-keys: cargo-${{ matrix.arch }}-

            - name: Install build tools
              run: |
                  sudo apt update
                  sudo apt install -y cmake musl-tools
                  if [ "${{ matrix.arch }}" = "aarch64" ]; then
                    sudo apt update
                    sudo apt install -y \
                      gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
                  fi

            - name: Install clang for webrtc-sys
              run: |
                  # Runner is x86_64 for both matrix entries; the aarch64 job
                  # cross-compiles with this same clang via --target.
                  LLVM_VERSION=21.1.8
                  LLVM_ROOT=/opt/llvm-$LLVM_VERSION
                  url="https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/LLVM-$LLVM_VERSION-Linux-X64.tar.xz"
                  sudo mkdir -p "$LLVM_ROOT"
                  curl --fail --location --silent --show-error "$url" \
                    | sudo tar -xJ --strip-components=1 -C "$LLVM_ROOT"
                  echo "LLVM_ROOT=$LLVM_ROOT" >> "$GITHUB_ENV"

            - name: Test
              env:
                  LK_CUSTOM_WEBRTC: ${{ github.workspace }}/livekit/webrtc-sys/libwebrtc/linux-${{ matrix.lk_arch }}-release
                  PKG_CONFIG_SYSROOT_DIR: ${{ matrix.pkg_config_sysroot }}
                  PKG_CONFIG_PATH: ${{ matrix.pkg_config_path }}
                  CC: ${{ env.LLVM_ROOT }}/bin/clang
                  CXX: ${{ env.LLVM_ROOT }}/bin/clang++
              run: cargo test ${{ matrix.test_flags }}

            - name: Build anazoa-tun
              env:
                  LK_CUSTOM_WEBRTC: ${{ github.workspace }}/livekit/webrtc-sys/libwebrtc/linux-${{ matrix.lk_arch }}-release
                  PKG_CONFIG_SYSROOT_DIR: ${{ matrix.pkg_config_sysroot }}
                  PKG_CONFIG_PATH: ${{ matrix.pkg_config_path }}
                  CC: ${{ env.LLVM_ROOT }}/bin/clang
                  CXX: ${{ env.LLVM_ROOT }}/bin/clang++
              run: cargo build --release --bin anazoa-tun --target ${{ matrix.dynamic_target }}

            - name: Build anazoa-auth and anazoa-ctl
              run: cargo build --release --bin anazoa-auth --bin anazoa-ctl --target ${{ matrix.static_target }}

            - uses: actions/upload-artifact@v7
              with:
                  name: anazoa-${{ matrix.arch }}
                  path: |
                      target/${{ matrix.static_target }}/release/anazoa-auth
                      target/${{ matrix.static_target }}/release/anazoa-ctl
                      target/${{ matrix.dynamic_target }}/release/anazoa-tun

    android:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
              with:
                  submodules: recursive

            - name: Compute livekit submodule SHA
              id: lk-sha
              run: echo "sha=$(git -C livekit rev-parse HEAD)" >> "$GITHUB_OUTPUT"

            - name: Restore libwebrtc cache
              id: webrtc-cache
              uses: actions/cache/restore@v6
              with:
                  path: livekit/webrtc-sys/libwebrtc/android-arm64-release
                  key: libwebrtc-android-arm64-${{ steps.lk-sha.outputs.sha }}-${{ hashFiles('patches/*.patch') }}

            - name: Patch livekit/webrtc-sys
              run: |
                  cp patches/hooks-opus.patch patches/hooks-vp9.patch livekit/webrtc-sys/libwebrtc/patches/
                  git -C livekit apply ../patches/livekit.patch

            - name: Free disk space
              if: steps.webrtc-cache.outputs.cache-hit != 'true'
              run: |
                  sudo rm -rf \
                    /usr/local/lib/android \
                    /usr/local/share/powershell \
                    /usr/share/dotnet \
                    /usr/share/swift \
                    /opt/ghc \
                    /opt/hostedtoolcache/CodeQL \
                    "$AGENT_TOOLSDIRECTORY/go" \
                    "$AGENT_TOOLSDIRECTORY/node"
                  sudo docker image prune -af || true
                  sudo mkdir -p /usr/local/lib/android
                  sudo chown "$(id -u):$(id -g)" /usr/local/lib/android
                  df -h

            - name: Install WebRTC build dependencies
              if: steps.webrtc-cache.outputs.cache-hit != 'true'
              run: |
                  sudo apt update
                  sudo apt install -y \
                    python3 python3-pip \
                    build-essential \
                    git curl lsb-release \
                    ninja-build \
                    pkg-config

            - name: Set up JDK
              uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: "17"

            - name: Build libwebrtc for Android
              # Also produces android-arm64-release/libwebrtc.jar via the
              # prefixed-jni subproject's own Gradle build, but that's not
              # used here: android/app/libs/libwebrtc.jar is committed
              # (see android/app/build.gradle.kts) rather than rebuilt each run.
              if: steps.webrtc-cache.outputs.cache-hit != 'true'
              working-directory: livekit/webrtc-sys/libwebrtc
              run: bash build_android.sh --arch arm64 --profile release

            - name: Save libwebrtc cache
              if: steps.webrtc-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@v6
              with:
                  path: livekit/webrtc-sys/libwebrtc/android-arm64-release
                  key: libwebrtc-android-arm64-${{ steps.lk-sha.outputs.sha }}-${{ hashFiles('patches/*.patch') }}

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: aarch64-linux-android

            - name: Cache Cargo registry
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.cargo/registry/index
                      ~/.cargo/registry/cache
                      ~/.cargo/git/db
                  key: cargo-android-arm64-${{ hashFiles('Cargo.lock') }}
                  restore-keys: cargo-android-arm64-

            # A standalone NDK, not whatever gclient vendored for the
            # libwebrtc build above: Chromium's bundled Android toolchain is
            # CIPD-only/incomplete and can't drive a plain `cargo build`.
            - name: Set up Android NDK
              id: ndk
              uses: nttld/setup-ndk@v1
              with:
                  ndk-version: r27c

            - name: Set up Android SDK
              uses: android-actions/setup-android@v4

            - name: Build anazoa-tun and the Android APK
              env:
                  ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
                  LK_CUSTOM_WEBRTC: ${{ github.workspace }}/livekit/webrtc-sys/libwebrtc/android-arm64-release
              run: bash scripts/build-android.sh

            - uses: actions/upload-artifact@v7
              with:
                  name: anazoa-android
                  path: android/app/build/outputs/apk/debug/app-debug.apk

    release:
        needs: build
        runs-on: ubuntu-latest
        if: startsWith(github.ref, 'refs/tags/')
        permissions:
            contents: write
        strategy:
            matrix:
                include:
                    - arch: x86_64
                      artifact: anazoa-x86_64
                      dynamic_target: x86_64-unknown-linux-gnu
                      static_target: x86_64-unknown-linux-musl
                    - arch: aarch64
                      artifact: anazoa-aarch64
                      dynamic_target: aarch64-unknown-linux-gnu
                      static_target: aarch64-unknown-linux-musl
        steps:
            - uses: actions/download-artifact@v8
              with:
                  name: ${{ matrix.artifact }}
                  path: /tmp/artifact

            - uses: actions/download-artifact@v8
              with:
                  name: libwebrtc-linux-${{ matrix.arch }}-dev
                  path: /tmp/artifact

            - name: Stage libwebrtc release asset
              run: |
                  cp /tmp/artifact/libwebrtc-linux-${{ matrix.arch }}-dev.tar.gz .

            - name: Create archive
              run: |
                  mkdir staging
                  cp /tmp/artifact/${{ matrix.dynamic_target }}/release/anazoa-tun staging/
                  cp /tmp/artifact/${{ matrix.static_target }}/release/anazoa-ctl staging/
                  cp /tmp/artifact/${{ matrix.static_target }}/release/anazoa-auth staging/
                  tar -czf anazoa-${{ matrix.arch }}.tar.gz -C staging .

            - uses: softprops/action-gh-release@v3
              with:
                  files: |
                      anazoa-${{ matrix.arch }}.tar.gz
                      libwebrtc-linux-${{ matrix.arch }}-dev.tar.gz

    release-android:
        needs: android
        runs-on: ubuntu-latest
        if: startsWith(github.ref, 'refs/tags/')
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v8
              with:
                  name: anazoa-android
                  path: /tmp/artifact

            - name: Stage APK release asset
              run: cp /tmp/artifact/app-debug.apk "anazoa-${GITHUB_REF_NAME#v}.apk"

            - uses: softprops/action-gh-release@v3
              with:
                  files: anazoa-*.apk

    docker:
        needs: build
        runs-on: ubuntu-latest
        if: startsWith(github.ref, 'refs/tags/')
        permissions:
            contents: read
            packages: write
        strategy:
            matrix:
                include:
                    - arch: x86_64
                      platform: linux/amd64
                      artifact: anazoa-x86_64
                      binary: x86_64-unknown-linux-gnu/release/anazoa-tun
                    - arch: aarch64
                      platform: linux/arm64
                      artifact: anazoa-aarch64
                      binary: aarch64-unknown-linux-gnu/release/anazoa-tun
        steps:
            - uses: actions/checkout@v7

            - uses: actions/download-artifact@v8
              with:
                  name: ${{ matrix.artifact }}
                  path: /tmp/artifact

            - name: Stage binary
              run: cp /tmp/artifact/${{ matrix.binary }} anazoa-tun

            - uses: docker/setup-buildx-action@v4

            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/metadata-action@v6
              id: meta
              with:
                  images: ghcr.io/${{ github.repository }}
                  flavor: suffix=-${{ matrix.arch }},onlatest=true
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}

            - uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: ${{ matrix.platform }}
                  push: true
                  provenance: false
                  tags: ${{ steps.meta.outputs.tags }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    docker-manifest:
        needs: docker
        runs-on: ubuntu-latest
        if: startsWith(github.ref, 'refs/tags/')
        permissions:
            contents: read
            packages: write
        steps:
            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/metadata-action@v6
              id: meta
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}

            - name: Create and push multi-arch manifest
              run: |
                  while IFS= read -r tag; do
                      version="${tag#*:}"
                      docker buildx imagetools create \
                          --tag "$tag" \
                          "ghcr.io/anazoa/anazoa:$version-x86_64" \
                          "ghcr.io/anazoa/anazoa:$version-aarch64"
                  done <<< "${{ steps.meta.outputs.tags }}"
