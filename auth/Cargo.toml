[package]
name = "anazoa-auth"
version.workspace = true
edition = "2024"

[dependencies]
anazoa-config = { path = "../config" }
anyhow = "1"
base64 = "0.22"
flate2 = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["native-tokio", "http1", "tls12", "logging", "ring"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
lz4_flex = "0.13"
quinn = { version = "0.11", default-features = false }
rand = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
tokio = { version = "1", features = ["io-util", "net", "time", "rt", "macros", "rt-multi-thread"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
tracing = "0.1"
unicode-truncate = "1.1"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "0.26"
wtransport = { version = "0.7", default-features = false, features = ["ring", "quinn"] }
