[workspace]
members = ["auth", "config", "ctl", "mock", "tun"]
resolver = "2"

[workspace.package]
version = "0.3.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"

# The Android cdylib: identical to release except panics unwind, so the JNI
# entry points' catch_unwind (tun/src/android.rs) can turn a Rust panic into
# a Java exception instead of aborting the whole app process.
[profile.android]
inherits = "release"
panic = "unwind"

# Coverage builds: `cargo llvm-cov` needs symbols and the coverage map kept,
# and works best without LTO/size optimization distorting the mapping.
[profile.coverage]
inherits = "release"
strip = false
lto = false
codegen-units = 16
opt-level = 1
